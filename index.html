["penal","Falsidades (arts. 293 a 311-A)","Mário, com o objetivo de obter vantagem em um concurso público, divulgou, em um grupo de mensagens, o conteúdo sigiloso da prova antes de sua aplicação. A conduta de Mário",["é atípica, por se tratar de concurso promovido por entidade privada contratada.","configura o crime de fraude em certames de interesse público, punido com reclusão de 1 a 4 anos e multa.","configura violação de sigilo funcional, ainda que Mário não seja funcionário público.","configura falsidade ideológica, por inserir informação falsa em documento.","só é punível se houver efetivo prejuízo à Administração."],1,"Art. 311-A, CP: utilizar ou divulgar indevidamente conteúdo sigiloso de concurso público. Pena: reclusão, de 1 a 4 anos, e multa. Não exige prejuízo efetivo.","TJSP 2023 — Q28 (art. 311-A)"],
["penal","Falsidades (arts. 293 a 311-A)","Joana, abordada por policiais, atribuiu-se o nome de sua irmã para não ser identificada e, assim, evitar o cumprimento de mandado de prisão contra ela expedido. Nos termos do Código Penal, a falsa identidade",["é crime somente se praticada por meio de documento.","é punida com detenção de 3 meses a 1 ano, ou multa, se o fato não constitui elemento de crime mais grave.","é punida com reclusão de 2 a 6 anos e multa.","exige que o agente obtenha efetivamente a vantagem pretendida.","só se configura se a identidade atribuída for de pessoa inexistente."],1,"Art. 307, CP: crime formal e expressamente subsidiário ('se o fato não constitui elemento de crime mais grave').","TJSP 2025 — Q18 (art. 307, subsidiariedade)"],
["penal","Crimes de funcionário público (312 a 327)","Lúcio, servidor autorizado a operar o sistema informatizado de um órgão público, inseriu dados falsos no sistema com o fim de obter vantagem indevida para um amigo. É correto afirmar que Lúcio",["praticou o crime de modificação não autorizada de sistema de informações, punido com detenção.","praticou o crime de inserção de dados falsos em sistema de informações, que se consuma com a inserção, independentemente da obtenção da vantagem.","só responde se o amigo obtiver efetivamente a vantagem.","praticou peculato culposo.","não praticou crime, pois estava autorizado a operar o sistema."],1,"Art. 313-A, CP: crime próprio do funcionário autorizado; formal (basta o fim especial). Pena: reclusão de 2 a 12 anos e multa. O art. 313-B trata de modificação não autorizada (detenção).","TJSP 2025 — Q19 (art. 313-A, crime formal)"],
["penal","Crimes de funcionário público (312 a 327)","O chefe de uma seção, por indulgência, deixou de responsabilizar subordinado que cometeu infração no exercício do cargo. Essa conduta caracteriza",["prevaricação, desde que haja interesse pessoal.","condescendência criminosa, punida com detenção de 15 dias a 1 mês, ou multa.","corrupção passiva privilegiada.","advocacia administrativa.","fato atípico, por ausência de dolo."],1,"Art. 320, CP: elemento subjetivo 'por indulgência'. Prevaricação exige 'interesse ou sentimento pessoal'.","TJSP 2025 — Q20 (art. 320, elemento subjetivo)"],
["penal","Crimes de funcionário público (312 a 327)","A respeito dos crimes praticados por funcionário público contra a Administração em geral, assinale a alternativa correta.",["No peculato culposo, a reparação do dano posterior à sentença irrecorrível extingue a punibilidade.","Na concussão, o núcleo do tipo é 'solicitar' vantagem indevida.","Na corrupção passiva, a pena é aumentada de um terço se, em consequência da vantagem ou promessa, o funcionário retarda ou deixa de praticar ato de ofício.","A prevaricação é punida com reclusão de 2 a 12 anos.","Considera-se funcionário público, para fins penais, apenas quem exerce cargo efetivo e remunerado."],2,"Art. 317, § 1º. Peculato culposo: reparação antes da sentença irrecorrível extingue; depois, reduz de metade. Concussão = exigir. Prevaricação: detenção de 3 meses a 1 ano. Art. 327 abrange quem exerce transitoriamente ou sem remuneração.","TJSP 2023 — Q26 (crimes contra a Administração)"],
["penal","Crimes de particular (328 a 337)","Antônio, inconformado com uma decisão, rasgou o edital afixado no fórum por ordem do juiz. Em seguida, subtraiu um processo que estava sob a custódia do escrevente. Nos termos do Código Penal, Antônio praticou, respectivamente, os crimes de",["dano qualificado e furto.","inutilização de edital ou de sinal (detenção de 1 mês a 1 ano, ou multa) e subtração ou inutilização de livro ou documento (reclusão de 2 a 5 anos).","desobediência e peculato.","desacato e supressão de documento.","fraude processual e extravio de documento."],1,"Arts. 336 e 337, CP. O art. 337 é subsidiário ('se o fato não constitui crime mais grave').","TJSP 2023 — Q29 (arts. 336 e 337)"],
["penal","Contra a administração da justiça (339 a 359)","Pedro teve suspenso, por decisão judicial, o direito de dirigir. Mesmo assim, continuou exercendo a atividade de motorista profissional, da qual fora suspenso pela mesma decisão. Em tese, Pedro praticou o crime de",["desobediência simples (art. 330).","desobediência a decisão judicial sobre perda ou suspensão de direito (art. 359), punido com detenção de 3 meses a 2 anos, ou multa.","fraude processual.","exercício arbitrário das próprias razões.","coação no curso do processo."],1,"Art. 359, CP: exercer função, atividade, direito, autoridade ou múnus de que foi suspenso ou privado por decisão judicial.","TJSP 2023 — Q30 (art. 359, caso prático)"],
["penal","Contra a administração da justiça (339 a 359)","Sobre os crimes contra a administração da justiça, assinale a alternativa INCORRETA.",["No falso testemunho, o fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o agente se retrata ou declara a verdade.","No exercício arbitrário das próprias razões, se não há emprego de violência, somente se procede mediante queixa.","Na fraude processual, se a inovação se destina a produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em dobro.","A exploração de prestígio consiste em solicitar ou receber vantagem a pretexto de influir em juiz, jurado, membro do Ministério Público, perito ou testemunha.","A comunicação falsa de crime é punida com reclusão de 2 a 8 anos e multa."],4,"Comunicação falsa de crime (art. 340): detenção de 1 a 6 meses, ou multa. Reclusão de 2 a 8 anos é a pena da denunciação caluniosa (art. 339).","TJSP 2023 — Q27 (administração da justiça, 'incorreta')"],
// ---------------- PROCESSO PENAL ----------------
["ppenal","Sujeitos processuais","Tício, juiz de direito, recebeu para julgamento ação penal em que já havia atuado, anos antes, como testemunha. Em outro processo, a ré é sua amiga íntima. Nos termos do CPP, Tício está, respectivamente,",["suspeito e impedido.","impedido e suspeito.","impedido em ambos os casos.","suspeito em ambos os casos.","apto a julgar o primeiro e impedido no segundo."],1,"Ter servido como testemunha: impedimento (art. 252, II). Amizade íntima: suspeição (art. 254, I).","TJSP 2023 — Q31 / TJSP 2025 — Q21 (arts. 252 e 254)"],
["ppenal","Sujeitos processuais","Sobre o acusado e seu defensor, nos termos do Código de Processo Penal, é correto afirmar:",["O acusado foragido poderá ser julgado sem defensor.","O defensor poderá abandonar o processo a qualquer tempo, independentemente de comunicação ao juiz.","A constituição de defensor independerá de instrumento de mandato, se o acusado o indicar por ocasião do interrogatório.","O acusado que não for pobre está dispensado de pagar os honorários do defensor dativo.","A falta de comparecimento do defensor, ainda que motivada, sempre determinará o adiamento do ato."],2,"Art. 266, CPP. Art. 261 (ninguém sem defensor), art. 265 (abandono só por motivo imperioso comunicado, multa de 10 a 100 SM), art. 263, p.u. (não pobre paga), art. 265, § 1º (adiamento se o defensor não puder comparecer por motivo justificado).","TJSP 2023 — Q32 / TJSP 2025 — Q22 (arts. 261 a 267)"],
["ppenal","Citação e intimação","Mévio, militar da ativa, foi denunciado. Caio, também denunciado, encontra-se no estrangeiro, em lugar sabido. Nos termos do CPP, a citação de",["Mévio será feita por edital e a de Caio, por hora certa.","Mévio far-se-á por intermédio do chefe do respectivo serviço, e Caio será citado mediante carta rogatória, suspendendo-se o curso do prazo de prescrição até o seu cumprimento.","Mévio e a de Caio serão feitas por edital, com prazo de 15 dias.","Mévio será feita por carta precatória, e Caio será citado por edital com prazo de 90 dias.","Caio dispensa formalidades, bastando a intimação de seu advogado."],1,"Arts. 358 e 368, CPP.","TJSP 2025 — Q23 (citação, inclusive de militar)"],
["ppenal","Citação e intimação","Caio, citado pessoalmente, deixou de comparecer à audiência sem motivo justificado. João, citado por edital, não compareceu nem constituiu advogado. Nos termos do CPP,",["em ambos os casos, o processo ficará suspenso.","o processo seguirá sem a presença de Caio; quanto a João, ficarão suspensos o processo e o curso do prazo prescricional.","o processo seguirá sem a presença de ambos.","será decretada a prisão preventiva de ambos, obrigatoriamente.","Caio será citado por edital e João, com hora certa."],1,"Art. 367 (revelia de quem foi citado pessoalmente) e art. 366 (suspensão quando citado por edital).","TJSP 2023 — Q33 (arts. 362, 366, 367)"],
["ppenal","Procedimento ordinário","Recebida a denúncia no procedimento comum ordinário, o acusado será citado para responder à acusação, por escrito, no prazo de",["5 dias, podendo arrolar até 5 testemunhas.","10 dias, podendo arrolar até 8 testemunhas.","15 dias, podendo arrolar até 10 testemunhas.","10 dias, podendo arrolar até 5 testemunhas.","20 dias, sem limite de testemunhas."],1,"Arts. 396 e 401, CPP. No sumário, o limite é de 5 testemunhas (art. 532).","TJSP 2025 — Q24 (arts. 394 e 396, prazos)"],
["ppenal","Tribunal do Júri","Encerrada a primeira fase do procedimento do júri, o juiz, não se convencendo da materialidade do fato nem da existência de indícios suficientes de autoria, impronunciou o acusado. Nesse caso,",["caberá recurso em sentido estrito, e não será possível nova denúncia.","enquanto não ocorrer a extinção da punibilidade, poderá ser formulada nova denúncia ou queixa se houver prova nova, e contra a decisão caberá apelação.","a decisão faz coisa julgada material, impedindo nova acusação.","o processo será remetido ao juiz singular para julgamento.","caberá carta testemunhável."],1,"Art. 414, parágrafo único, e art. 416, CPP. Da pronúncia cabe RESE (art. 581, IV).","TJSP 2023 — Q35 (arts. 414 a 420)"],
["ppenal","Tribunal do Júri","Sobre a pronúncia, a intimação dessa decisão e a desclassificação no procedimento do júri, assinale a alternativa correta.",["A intimação da pronúncia será feita ao defensor constituído pessoalmente, e ao Ministério Público por publicação.","O acusado solto que não for encontrado será intimado da pronúncia por edital.","O juiz não poderá dar ao fato definição jurídica diversa da constante da acusação se o acusado ficar sujeito a pena mais grave.","Se o juiz se convencer da existência de crime não doloso contra a vida, deverá julgá-lo imediatamente.","Da decisão de pronúncia cabe apelação."],1,"Art. 420, parágrafo único. A intimação é pessoal ao acusado, ao defensor nomeado e ao MP; por publicação ao defensor constituído (art. 420, I e II). Art. 418 permite definição diversa ainda que mais grave. Art. 419: remessa ao juiz competente. Pronúncia: RESE.","TJSP 2023 — Q35 (júri)"],
["ppenal","Restauração de autos","Durante o trâmite de uma ação penal, os autos originais foram extraviados e instaurou-se a restauração. No curso desta, os autos originais foram encontrados. Nos termos do CPP,",["a restauração prosseguirá e os autos originais serão arquivados.","o processo continuará nos autos originais, apensando-se a eles os autos da restauração.","ambos os autos serão declarados nulos.","o processo será extinto sem julgamento do mérito.","o juiz determinará a renovação de todos os atos processuais."],1,"Art. 547, parágrafo único, CPP. Os causadores do extravio respondem pelas custas em dobro, sem prejuízo da responsabilidade criminal (art. 546).","TJSP 2023 — Q36 (arts. 541 a 548)"],
["ppenal","Revisão criminal","Acerca da revisão criminal, é correto afirmar que",["só pode ser requerida antes da extinção da pena.","pode ser requerida pelo próprio réu ou por procurador legalmente habilitado ou, no caso de morte do réu, pelo cônjuge, ascendente, descendente ou irmão.","pode resultar no agravamento da pena.","é cabível contra sentença absolutória.","admite reiteração do pedido com os mesmos fundamentos."],1,"Art. 623, CPP. Art. 622 (a qualquer tempo, antes ou após a extinção da pena; reiteração só com novas provas); art. 626, p.u. (não pode agravar a pena); cabe contra condenação.","TJSP 2023 — Q37 (revisão criminal)"],
["ppenal","JECrim (Lei 9.099/95)","No Juizado Especial Criminal, da sentença caberá apelação, que será interposta no prazo de ___, e os embargos de declaração serão opostos no prazo de ___.",["5 dias … 2 dias","10 dias … 5 dias","15 dias … 5 dias","10 dias … 2 dias","8 dias … 3 dias"],1,"Lei 9.099/95, arts. 82, § 1º (apelação em 10 dias, com razões) e 83, § 1º (embargos em 5 dias).","TJSP 2025 — Q25 (recursos nos Juizados)"],
// ---------------- PROCESSO CIVIL ----------------
["pcivil","Tempo, lugar e prazos","Em ação de cobrança, o réu foi citado por meio eletrônico e confirmou o recebimento da citação. Nos termos do CPC, considera-se dia do começo do prazo para contestar",["a data da expedição da citação.","o quinto dia útil seguinte à confirmação, na forma prevista na mensagem de citação, do recebimento da citação realizada por meio eletrônico.","o dia seguinte ao da confirmação.","a data da juntada do aviso de recebimento.","o décimo dia corrido após o envio da citação."],1,"Art. 231, IX, CPC (incluído pela Lei 14.195/2021).","TJSP 2023 — Q39 (art. 231, citação eletrônica)"],
["pcivil","Impedimento e suspeição","Rafael, escrivão de uma vara cível, verificou que atua como advogado, em um dos processos do cartório, o seu irmão. Nos termos do CPC,",["não há impedimento, porque os motivos de impedimento aplicam-se somente ao juiz.","aplicam-se os motivos de impedimento e de suspeição aos auxiliares da justiça, de modo que Rafael está impedido.","Rafael está suspeito, podendo atuar se as partes concordarem.","o impedimento só existiria se o advogado fosse seu cônjuge.","Rafael pode atuar livremente, pois não profere decisões."],1,"Art. 148, II, c/c art. 144, III, CPC (parente colateral até o 3º grau).","TJSP 2023 — Q38 (arts. 144, 148, 149)"],
["pcivil","Tutela provisória","A respeito da tutela provisória, assinale a alternativa correta.",["A tutela provisória requerida em caráter incidental depende do pagamento de custas.","A tutela provisória conserva sua eficácia na pendência do processo, mas pode, a qualquer tempo, ser revogada ou modificada.","A tutela de urgência de natureza antecipada pode ser concedida ainda que haja perigo de irreversibilidade dos efeitos da decisão.","A tutela de evidência exige a demonstração de perigo de dano.","A tutela provisória será requerida sempre ao tribunal."],1,"Art. 296, CPC. Incidental não paga custas (295); antecipada não cabe com perigo de irreversibilidade (300, § 3º); evidência independe de perigo (311); requerida ao juízo da causa (299).","TJSP 2023 — Q40 (arts. 294, 299, 300)"],
["pcivil","Provas","Luana pretende ajuizar ação, mas antes deseja produzir uma prova que pode viabilizar a autocomposição com a outra parte. Nos termos do CPC, a produção antecipada da prova",["só é admitida se houver fundado receio de que a prova se torne impossível.","será admitida nos casos em que a prova a ser produzida seja suscetível de viabilizar a autocomposição ou outro meio adequado de solução de conflito.","exige o ajuizamento prévio da ação principal.","admite ampla defesa e todos os recursos.","previne a competência para a ação principal."],1,"Art. 381, II, CPC. No procedimento não se admite defesa ou recurso, salvo contra a decisão que indeferir totalmente a prova (art. 382, § 4º); não previne competência (art. 381, § 3º).","TJSP 2023 — Q41 (arts. 381 e 382)"],
["pcivil","Recursos — disposições gerais","Com relação ao direito de recorrer, assinale a alternativa correta.",["A renúncia ao direito de recorrer depende da aceitação da outra parte.","O recorrente poderá, a qualquer tempo, sem a anuência do recorrido ou dos litisconsortes, desistir do recurso.","A parte que aceitar tacitamente a decisão poderá recorrer, desde que no prazo.","O recurso adesivo será conhecido ainda que haja desistência do recurso principal.","Dos despachos cabe agravo de instrumento."],1,"Art. 998, CPC. Renúncia independe de aceitação (999); aceitação impede recurso (1.000); adesivo segue o principal (997, § 2º, III); despachos são irrecorríveis (1.001).","TJSP 2018 — Q42 / TJSP 2023 — Q42 (arts. 997 a 1.000)"],
["pcivil","Juizado Especial Cível (Lei 9.099/95)","Serão admitidas a propor ação perante o Juizado Especial Cível, nos termos da Lei nº 9.099/1995,",["as pessoas jurídicas de direito público.","as pessoas jurídicas qualificadas como Organização da Sociedade Civil de Interesse Público.","as empresas públicas da União.","a massa falida.","os cessionários de direito de pessoas jurídicas."],1,"Art. 8º, § 1º, III, Lei 9.099/95. As demais estão vedadas pelo caput ou pelo inciso I.","TJSP 2018 — Q39 (art. 8º)"],
["pcivil","Juizado da Fazenda Pública (Lei 12.153/09)","Diante do que prevê a Lei nº 12.153/2009, é correto afirmar:",["Nas causas do Juizado Especial da Fazenda Pública haverá reexame necessário.","Os entes públicos terão prazo em dobro para recorrer.","O pagamento de obrigação de pequeno valor será feito no prazo máximo de 60 dias, contado da entrega da requisição, independentemente de precatório.","As ações de improbidade administrativa são de competência do Juizado da Fazenda Pública.","Podem ser autoras as pessoas jurídicas de direito público."],2,"Art. 13, I, Lei 12.153/2009. Sem reexame (art. 11) e sem prazo diferenciado (art. 7º); improbidade excluída (art. 2º, § 1º, I); autores: PF, ME e EPP (art. 5º).","TJSP 2018 — Q43 / TJSP 2023 — Q44 (arts. 11 e 13)"],
["pcivil","Auxiliares da justiça","Legalmente, incumbe ao escrivão ou ao chefe de secretaria:",["auxiliar o juiz na manutenção da ordem.","comparecer às audiências ou, não podendo fazê-lo, designar servidor para substituí-lo.","efetuar avaliações, quando for o caso.","executar as ordens do juiz a que estiver subordinado.","fazer pessoalmente citações, prisões e penhoras, privativamente."],1,"Art. 152, III, CPC. Auxiliar na manutenção da ordem, efetuar avaliações e executar ordens do juiz são atribuições do oficial de justiça (art. 154).","TJSP 2018 — Q38 (art. 152)"],
["pcivil","Tempo, lugar e prazos","Processam-se durante as férias forenses, onde as houver, e não se suspendem pela superveniência delas:",["os processos de execução fiscal.","os procedimentos de jurisdição voluntária e os necessários à conservação de direitos, quando puderem ser prejudicados pelo adiamento.","as ações de cobrança de valor superior a 40 salários mínimos.","os processos que versem sobre arbitragem, inclusive cumprimento de carta arbitral.","todas as ações em que a Fazenda Pública for parte."],1,"Art. 215, I, CPC. Também: alimentos e nomeação/remoção de tutor e curador (II) e os processos que a lei determinar (III).","TJSP 2018 — Q41 (art. 215)"],
// ---------------- CONSTITUCIONAL ----------------
["const","Direitos individuais e coletivos (art. 5º)","Durante a madrugada, policiais, munidos de mandado judicial de busca e apreensão, pretendiam ingressar na casa de Juliete, sem o seu consentimento, sem que houvesse flagrante delito, desastre ou necessidade de prestar socorro. De acordo com a Constituição Federal, o ingresso",["é lícito, pois há determinação judicial.","é ilícito, pois, por determinação judicial, a casa só pode ser penetrada durante o dia.","é lícito, desde que acompanhado por dois vizinhos.","depende apenas de autorização do delegado de polícia.","é lícito se houver suspeita de crime."],1,"Art. 5º, XI, CF: 'durante o dia, por determinação judicial'. A restrição de horário vale só para a ordem judicial.","TJSP 2025 — Q31 (art. 5º, XI, caso concreto)"],
["const","Direitos individuais e coletivos (art. 5º)","No caso de iminente perigo público, a autoridade competente poderá usar de propriedade particular,",["mediante prévia e justa indenização em dinheiro.","assegurada ao proprietário indenização ulterior, se houver dano.","sem qualquer indenização, em razão da supremacia do interesse público.","desde que haja autorização judicial prévia.","somente com o consentimento do proprietário."],1,"Art. 5º, XXV, CF (requisição administrativa). Prévia e justa indenização em dinheiro é regra da desapropriação (XXIV).","TJSP 2023 — Q46 (art. 5º, XXII a XXV)"],
["const","Direitos individuais e coletivos (art. 5º)","Nos termos da Constituição Federal, a lei regulará a individualização da pena e adotará, entre outras, as seguintes penas:",["privação ou restrição da liberdade, perda de bens, multa, prestação social alternativa e suspensão ou interdição de direitos.","banimento, multa e perda de bens.","trabalhos forçados, prestação social alternativa e multa.","caráter perpétuo, nos crimes hediondos, e multa.","morte, em caso de crimes hediondos, e privação da liberdade."],0,"Art. 5º, XLVI, CF. As penas vedadas estão no inciso XLVII.","TJSP 2023 — Q47 (art. 5º, XLVI e XLVII)"],
["const","Direitos individuais e coletivos (art. 5º)","A respeito das ações constitucionais, assinale a alternativa correta.",["O mandado de segurança é gratuito, por expressa previsão constitucional.","Conceder-se-á mandado de injunção sempre que a falta de norma regulamentadora torne inviável o exercício dos direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania.","O habeas data protege a liberdade de locomoção.","A ação popular só pode ser proposta pelo Ministério Público.","O habeas corpus é cabível para proteger direito líquido e certo não amparado por mandado de segurança."],1,"Art. 5º, LXXI, CF. Gratuitos são HC e HD (LXXVII); HD protege informações pessoais; ação popular: qualquer cidadão; direito líquido e certo: MS.","TJSP 2023 — Q45 / TJSP 2025 — Q32 (remédios constitucionais)"],
["const","Nacionalidade (arts. 12 e 13)","André, brasileiro naturalizado há 15 anos, pretende candidatar-se e exercer cargos públicos. Nos termos da Constituição Federal, André poderá ser",["Presidente da Câmara dos Deputados.","Ministro do Supremo Tribunal Federal.","Senador da República e Ministro do Superior Tribunal de Justiça.","oficial das Forças Armadas.","Ministro de Estado da Defesa."],2,"Art. 12, § 3º, CF. Senador e Ministro do STJ não são privativos de nato; os demais são.","TJSP 2023 — Q51 / TJSP 2025 — Q33 (art. 12, § 3º)"],
["const","Servidores públicos (arts. 39 a 41)","Isaías, servidor público estável, teve o cargo que ocupava extinto. Nos termos da Constituição Federal, Isaías",["será exonerado, com direito a indenização.","ficará em disponibilidade, com remuneração proporcional ao tempo de serviço, até seu adequado aproveitamento em outro cargo.","será demitido, sem direito a indenização.","ficará em disponibilidade com remuneração integral.","será automaticamente aposentado."],1,"Art. 41, § 3º, CF.","TJSP 2023 — Q48 (art. 41)"],
["const","Poder Judiciário (art. 92)","São órgãos do Poder Judiciário, nos termos da Constituição Federal:",["o Conselho Nacional de Justiça e o Tribunal de Contas da União.","o Conselho Nacional de Justiça e o Tribunal Superior do Trabalho.","o Ministério Público e os Tribunais de Justiça.","o Conselho Nacional do Ministério Público e o Superior Tribunal de Justiça.","a Defensoria Pública e os Tribunais Regionais Federais."],1,"Art. 92, I-A e II-A, CF. TCU, MP, CNMP e Defensoria não integram o Judiciário.","TJSP 2023 — Q50 (art. 92)"],
["const","Direitos sociais (arts. 6º a 11)","Rodrigo foi dispensado e, três anos depois, pretende cobrar créditos trabalhistas. Nos termos da Constituição Federal, quanto aos créditos resultantes das relações de trabalho, o prazo prescricional é de",["dois anos para os trabalhadores urbanos e cinco anos para os rurais, sem limite após a extinção do contrato.","cinco anos para os trabalhadores urbanos e rurais, até o limite de dois anos após a extinção do contrato de trabalho.","três anos, contados da extinção do contrato.","dez anos, contados de cada lesão.","cinco anos, contados da extinção do contrato, sem outro limite."],1,"Art. 7º, XXIX, CF. Como passaram três anos da extinção, a pretensão de Rodrigo está prescrita.","TJSP 2025 — Q35 (art. 7º, prescrição)"],
// ---------------- ADMINISTRATIVO ----------------
["adm","Improbidade","João, escrevente de uma Vara da Fazenda Pública, foi acusado de ato de improbidade. Considerando a Lei nº 8.429/1992, com as alterações da Lei nº 14.230/2021, é correto afirmar:",["Basta a voluntariedade do agente para a configuração do ato de improbidade.","O Ministério Público poderá celebrar acordo de não persecução civil, desde que dele advenham, ao menos, o integral ressarcimento do dano e a reversão à pessoa jurídica lesada da vantagem indevida obtida.","A ação para aplicação das sanções prescreve em 5 anos, contados do término do exercício do cargo.","Os atos de improbidade podem ser praticados de forma culposa.","Somente servidores efetivos podem praticar atos de improbidade."],1,"Art. 17-B, Lei 8.429/92. Exige dolo, não basta a voluntariedade (art. 1º, §§ 1º e 2º); prescrição de 8 anos a partir do fato (art. 23); agente público abrange quem exerce transitoriamente ou sem remuneração (art. 2º).","TJSP 2023 — Q52 (arts. 1º, 2º, 17-B, 23)"],
["adm","Improbidade","A respeito da prescrição da ação para aplicação das sanções previstas na Lei nº 8.429/92, assinale a alternativa correta.",["O prazo é de 5 anos, contados da ciência do fato pela autoridade competente.","O prazo é de 8 anos, contados a partir da ocorrência do fato ou, no caso de infrações permanentes, do dia em que cessou a permanência.","As ações de improbidade são imprescritíveis.","O prazo é de 10 anos, contados do término do mandato.","Interrompida a prescrição, o prazo recomeça a correr por inteiro."],1,"Art. 23, caput. Interrompida, recomeça pela metade do prazo (art. 23, § 5º).","TJSP 2023 — Q54 (art. 23)"],
["adm","Estatuto SP","Paulo, funcionário público civil do Estado de São Paulo, ausentou-se do serviço, sem justa causa, por 35 dias consecutivos. Nos termos da Lei nº 10.261/1968, Paulo está sujeito à pena de",["repreensão.","suspensão por até 90 dias.","demissão, por abandono de cargo.","multa.","cassação de disponibilidade."],2,"Art. 256, I e § 1º, Lei 10.261/68: abandono = ausência sem justa causa por mais de 30 dias consecutivos.","TJSP 2023 — Q55 (penas disciplinares, arts. 253 a 259)"],
["adm","Estatuto SP","Com base na Lei nº 10.261/1968, assinale a alternativa que apresenta corretamente as penas disciplinares previstas no Estatuto.",["Advertência, suspensão, destituição de cargo em comissão e demissão.","Repreensão, suspensão, multa, demissão, demissão a bem do serviço público e cassação de aposentadoria ou disponibilidade.","Censura, suspensão de até 120 dias e exoneração.","Repreensão verbal, multa e prisão administrativa.","Advertência, multa e cassação de mandato."],1,"Art. 251, Lei 10.261/68. A suspensão não pode exceder 90 dias (art. 254).","TJSP 2023 — Q55 (art. 251)"],
// ---------------- LEGISLAÇÃO INTERNA / NSCGJ ----------------
["interna","Normas da Corregedoria — correições","Segundo as Normas da Corregedoria Geral da Justiça, a função correcional",["é exercida exclusivamente pelo Corregedor Geral da Justiça.","é permanente e se exerce por meio de correições ordinárias, extraordinárias e visitas correcionais.","só é exercida mediante provocação das partes.","é exercida pelos escrivães-diretores sobre os juízes.","limita-se às correições extraordinárias."],1,"NSCGJ, arts. 5º e 6º: exercida pelo Corregedor Geral e, nos limites de suas atribuições, pelos juízes de primeiro grau; é permanente. Confira a redação no texto oficial.","TJSP 2018/2023 — Q63 (correições, arts. 5º a 9º)"],
["interna","Normas da Corregedoria — correições","De acordo com as Normas da Corregedoria, o juiz corregedor permanente realizará correição ordinária em todas as serventias sob sua corregedoria",["a cada dois anos, no mês de julho.","uma vez por ano, de preferência no mês de dezembro, anunciada por edital com antecedência mínima de quinze dias.","semestralmente, sem necessidade de edital.","mensalmente, mediante visita sem aviso prévio.","somente quando houver reclamação de parte."],1,"NSCGJ, art. 8º. A visita correcional deve ocorrer em até 30 dias após o juiz assumir a corregedoria em caráter definitivo (art. 9º). Confira no texto oficial.","TJSP 2023 — Q63 (art. 8º)"],
["interna","Normas da Corregedoria — autos","Conforme as Normas da Corregedoria, em relação à autuação e à formação dos autos físicos, é correto afirmar:",["Cada volume dos autos poderá conter até 500 folhas.","A autuação deverá ocorrer em 24 horas, e cada volume não excederá, em regra, 200 folhas.","É permitido lançar o termo de juntada no verso da própria petição.","As cotas marginais e interlineares são admitidas quando feitas pelo advogado.","A numeração repetida deve ser corrigida com a renumeração de todo o processo."],1,"NSCGJ, arts. 87 e 89. É vedado lançar termos no verso de petições (art. 95) e são vedadas cotas marginais e interlineares (art. 96); numeração errada é corrigida sem renumeração (art. 91). Confira no texto oficial.","TJSP 2023 — Q64 (escrituração e autuação)"],
["interna","Normas da Corregedoria — audiências","Nos termos das Normas da Corregedoria, a designação de audiências",["pode ser delegada ao escrivão em qualquer caso.","é atribuição exclusiva e indelegável do juiz, salvo nos juizados especiais.","compete ao chefe de seção judiciário.","pode ser feita pelo advogado mediante petição.","é atribuição do oficial de justiça."],1,"NSCGJ, art. 143. Os processos devem ser verificados com antecedência de dez dias da audiência (art. 148). Confira no texto oficial.","TJSP 2023/2025 — audiências (arts. 143 a 149)"],
["interna","Normas da Corregedoria — carga dos autos","Sobre a consulta e a carga de autos físicos, segundo as Normas da Corregedoria, assinale a alternativa correta.",["É permitido reter documento de identificação do advogado como garantia da devolução.","O advogado sem procuração nos autos poderá retirá-los pelo prazo de uma hora, para extração de cópias (carga rápida), ressalvados os processos em segredo de justiça.","Qualquer pessoa pode fazer carga de processos em segredo de justiça.","A carga é permitida a estagiários sem qualquer credenciamento.","Os autos não podem ser consultados por quem não seja parte."],1,"NSCGJ, arts. 158 a 160 e 166 (vedada a retenção de documento de identificação). Confira no texto oficial.","TJSP 2023 — Q62 (arts. 157 a 166)"],
["interna","Normas da Corregedoria — processo eletrônico","De acordo com as Normas da Corregedoria, no processo eletrônico, a petição será considerada tempestiva quando transmitida até",["as 18 horas do último dia do prazo.","as 24 horas do último dia do prazo, considerada a hora oficial de Brasília.","as 20 horas do último dia do prazo.","o encerramento do expediente forense.","as 23h59 do dia seguinte ao vencimento."],1,"NSCGJ, art. 1.198 (em sintonia com o art. 213 do CPC). Se o vencimento cair em dia sem expediente, prorroga-se para o primeiro dia útil seguinte. Confira no texto oficial.","TJSP 2023 — Q60 (peticionamento eletrônico)"],
["interna","Normas da Corregedoria — processo eletrônico","Segundo as Normas da Corregedoria, a indisponibilidade do sistema de peticionamento eletrônico prorroga o prazo para o primeiro dia útil seguinte quando for superior a",["15 minutos, em qualquer horário.","60 minutos, ininterruptos ou não, se ocorrida entre 6h e 23h.","3 horas, apenas em dias úteis.","24 horas consecutivas.","30 minutos, entre 8h e 18h."],1,"NSCGJ, art. 1.205, I. A indisponibilidade severa (superior a 3 horas, entre 9h e 19h, em dias úteis) tem regras próprias (art. 1.205-A). Confira no texto oficial.","TJSP 2023/2025 — processo eletrônico"],
["interna","Normas da Corregedoria — prazos","Conforme as Normas da Corregedoria, quanto às intimações eletrônicas realizadas por portal, considera-se realizada a intimação",["no dia do envio, independentemente de consulta.","no dia em que o intimando efetivar a consulta, devendo esta ocorrer em até 10 dias corridos, sob pena de considerar-se automaticamente realizada ao término desse prazo.","somente após publicação no Diário da Justiça.","no quinto dia útil após o envio.","após confirmação por telefone."],1,"NSCGJ, art. 1.248-A (em sintonia com a Lei 11.419/2006, art. 5º). Confira no texto oficial.","TJSP — processo eletrônico, intimações"],

["atual","Estatuto da Pessoa com Deficiência","Considere as afirmações sobre o Estatuto da Pessoa com Deficiência (Lei nº 13.146/2015): I. A deficiência não afeta a plena capacidade civil da pessoa, inclusive para exercer o direito à guarda e à adoção. II. A pessoa com deficiência somente será atendida sem seu consentimento prévio, livre e esclarecido em casos de risco de morte e de emergência em saúde. III. A pessoa com deficiência pode ser obrigada a se submeter a tratamento ou institucionalização forçada quando houver laudo médico. Está correto o que se afirma em",["I, apenas.","I e II, apenas.","II e III, apenas.","III, apenas.","I, II e III."],1,"Arts. 6º e 13 (I e II corretos). Art. 11: não pode ser obrigada a tratamento ou institucionalização forçada (III errado).","TJSP 2025 — Q50 (EPD, arts. 2º, 6º, 9º, 12 e 13)"],

["info","OneDrive","No OneDrive integrado ao Windows 10/11, com o recurso Arquivos Sob Demanda ativado, um arquivo exibido com o ícone de nuvem azul",["está armazenado apenas no computador, sem cópia na nuvem.","está disponível somente online e não ocupa espaço no computador; é baixado quando aberto.","foi marcado para estar sempre disponível no dispositivo.","foi excluído da nuvem e permanece na Lixeira.","está com erro de sincronização."],1,"Nuvem = somente online. Marca de seleção verde em fundo branco = disponível localmente; círculo verde sólido = 'Sempre manter neste dispositivo'.","TJSP 2025 — Q55 (OneDrive e arquivos sob demanda)"],
["info","Excel","Em uma planilha do Excel 365, em português, a fórmula =SE(MAIOR(A1:A5;2)>MENOR(A1:A5;2);\"SIM\";\"NÃO\"), aplicada aos valores 4, 9, 2, 7 e 5 contidos em A1:A5, retorna",["NÃO, pois o segundo maior valor é 5.","SIM, pois o segundo maior valor (7) é maior que o segundo menor valor (4).","SIM, pois o maior valor (9) é maior que o menor (2).","#VALOR!, pois MAIOR exige um único argumento.","NÃO, pois os valores são iguais."],1,"MAIOR(intervalo;k) e MENOR(intervalo;k) retornam o k-ésimo maior/menor. Ordenando: 2, 4, 5, 7, 9 → 2º maior = 7; 2º menor = 4.","TJSP 2025 — Q59 (SE, MAIOR e MENOR)"],
["info","Excel","Um usuário digitou, na célula D2 do Excel, a fórmula =PROCV(B2;$F$2:$H$20;3;0) e a copiou para D3. A fórmula resultante em D3 será",["=PROCV(B3;$F$3:$H$21;3;0)","=PROCV(B3;$F$2:$H$20;3;0)","=PROCV(B2;$F$2:$H$20;3;0)","=PROCV(C3;$F$2:$H$20;4;0)","=PROCV(B3;$F$2:$H$20;4;0)"],1,"B2 é relativa (vira B3); $F$2:$H$20 é absoluta (não muda). O 4º argumento 0 (FALSO) indica correspondência exata.","TJSP 2025 — Q58 (PROCV e referências)"],
["info","Correio eletrônico","Ana recebeu um e-mail enviado por Bruno, no qual Carla estava no campo Cc e Diego no campo Cco. Se Ana clicar em 'Responder a todos', sem alterar os destinatários, a resposta será enviada para",["Bruno, Carla e Diego.","Bruno e Carla.","Bruno, apenas.","Carla e Diego.","Bruno e Diego."],1,"Destinatários em Cco não aparecem para os demais e, por isso, não recebem o 'Responder a todos'.","TJSP 2025 — Q60 (Responder a todos, Cc e Cco)"],
["info","Internet","Em uma pesquisa no Google, para encontrar apenas páginas do site do TJSP que contenham exatamente a expressão concurso escrevente, o usuário deve digitar:",["concurso escrevente -tjsp.jus.br","\"concurso escrevente\" site:tjsp.jus.br","concurso OR escrevente tjsp.jus.br","(concurso escrevente) filetype:tjsp.jus.br","*concurso escrevente* inurl:tjsp"],1,"Aspas = expressão exata; site: = restringe ao domínio. O sinal de menos exclui termos; filetype: filtra tipo de arquivo.","TJSP 2025 — Q61 (operadores de busca)"],
["info","Microsoft 365","No Microsoft Teams, para chamar a atenção de um colega específico em uma mensagem de um canal, fazendo com que ele receba uma notificação, o usuário deve",["digitar # seguido do nome do colega.","digitar @ seguido do nome do colega e selecioná-lo na lista (menção).","marcar a mensagem como importante, apenas.","enviar a mensagem com o comando /ping.","fixar a mensagem no canal."],1,"Menções com @ notificam a pessoa (ou o canal/equipe com @canal/@equipe).","TJSP 2025 — Q62 (Teams, menção)"],
["info","Word","No Microsoft Word 365, em português, um usuário selecionou um parágrafo e pressionou, em sequência, Ctrl+N, Ctrl+E e Ctrl+I. O parágrafo ficou",["negrito, alinhado à esquerda e sublinhado.","negrito, centralizado e itálico.","sublinhado, justificado e itálico.","negrito, centralizado e com espaçamento duplo.","itálico, à direita e negrito."],1,"Word em português: Ctrl+N = negrito; Ctrl+E = centralizar; Ctrl+I = itálico.","TJSP 2025 — Q57 (Word: formatação e atalhos)"],

["rl","Negação da condicional","Uma negação lógica da afirmação “Se o processo foi digitalizado e o prazo venceu, então o escrevente arquivou os autos” é:",["Se o processo não foi digitalizado ou o prazo não venceu, então o escrevente não arquivou os autos.","O processo foi digitalizado, o prazo venceu e o escrevente não arquivou os autos.","O processo não foi digitalizado, o prazo não venceu e o escrevente arquivou os autos.","O escrevente não arquivou os autos ou o processo foi digitalizado.","Se o escrevente não arquivou os autos, então o processo não foi digitalizado."],1,"~[(p ∧ q) → r] ≡ (p ∧ q) ∧ ~r. A alternativa E é equivalente (contrapositiva parcial), não a negação.","TJSP 2025 — Q64 (negação de condicional composta)"],
["rl","Diagramas lógicos (conjuntos)","Em um cartório com 50 servidores, 28 atuam no atendimento, 22 atuam na expedição de mandados e 9 não atuam em nenhuma dessas atividades. O número de servidores que atuam nas duas atividades é",["7","9","11","13","15"],1,"Atuam em pelo menos uma: 50 − 9 = 41. 28 + 22 − x = 41 → x = 9.","TJSP 2025 — Q51 (teoria dos conjuntos)"],
["rl","Associação lógica","Ana, Bia e Caio trabalham em setores diferentes: Distribuição, Protocolo e Arquivo. Sabe-se que Ana não trabalha no Protocolo nem no Arquivo e que Caio não trabalha no Protocolo. Logo,",["Bia trabalha no Arquivo.","Caio trabalha na Distribuição.","Bia trabalha no Protocolo e Caio, no Arquivo.","Ana trabalha no Arquivo.","Caio trabalha no Protocolo."],2,"Ana → Distribuição. Caio não está no Protocolo → Arquivo. Sobra o Protocolo para Bia.","TJSP 2025 — Q66/Q68 (disposição/associação)"],
["mat","Geometria","Um terreno retangular tem área de 96 m², e seu comprimento excede a largura em 4 m. O perímetro desse terreno é",["36 m","40 m","44 m","48 m","52 m"],1,"x(x + 4) = 96 → x² + 4x − 96 = 0 → x = 8. Lados 8 e 12; perímetro = 2(8 + 12) = 40 m.","TJSP 2025 — Q53 (áreas e equação do 2º grau)"],
["mat","Média ponderada","A média aritmética das idades de 8 servidores de uma seção é 40 anos. Com a chegada de mais 2 servidores, a média passou a ser 38 anos. A soma das idades dos dois novos servidores é",["56","60","64","76","80"],1,"Soma inicial = 320. Nova soma = 10 × 38 = 380. Novos = 380 − 320 = 60.","TJSP 2025 — Q54 (médias)"]
];

// ===== LEI SECA — dispositivos do edital (texto legal; leis não têm proteção autoral — Lei 9.610/98, art. 8º, IV) =====
// Trechos selecionados. Sempre confira a redação atualizada no Planalto / site do TJSP.
const LEIS = [
 {id:"cp", nome:"Código Penal", sigla:"CP", materia:"penal", arts:[
  ["297","Falsificação de documento público","Falsificar, no todo ou em parte, documento público, ou alterar documento público verdadeiro: Pena - reclusão, de dois a seis anos, e multa. § 1º Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte."],
  ["298","Falsificação de documento particular","Falsificar, no todo ou em parte, documento particular ou alterar documento particular verdadeiro: Pena - reclusão, de um a cinco anos, e multa. Parágrafo único. Para fins do disposto no caput, equipara-se a documento particular o cartão de crédito ou débito."],
  ["299","Falsidade ideológica","Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante: Pena - reclusão, de um a cinco anos, e multa, se o documento é público, e reclusão de um a três anos, e multa, se o documento é particular."],
  ["304","Uso de documento falso","Fazer uso de qualquer dos papéis falsificados ou alterados, a que se referem os arts. 297 a 302: Pena - a cominada à falsificação ou à alteração."],
  ["307","Falsa identidade","Atribuir-se ou atribuir a terceiro falsa identidade para obter vantagem, em proveito próprio ou alheio, ou para causar dano a outrem: Pena - detenção, de três meses a um ano, ou multa, se o fato não constitui elemento de crime mais grave."],
  ["311-A","Fraudes em certames de interesse público","Utilizar ou divulgar, indevidamente, com o fim de beneficiar a si ou a outrem, ou de comprometer a credibilidade do certame, conteúdo sigiloso de: I - concurso público; II - avaliação ou exame públicos; III - processo seletivo para ingresso no ensino superior; ou IV - exame ou processo seletivo previstos em lei: Pena - reclusão, de um a quatro anos, e multa."],
  ["312","Peculato","Apropriar-se o funcionário público de dinheiro, valor ou qualquer outro bem móvel, público ou particular, de que tem a posse em razão do cargo, ou desviá-lo, em proveito próprio ou alheio: Pena - reclusão, de dois a doze anos, e multa. § 2º Se o funcionário concorre culposamente para o crime de outrem: Pena - detenção, de três meses a um ano. § 3º No caso do parágrafo anterior, a reparação do dano, se precede à sentença irrecorrível, extingue a punibilidade; se lhe é posterior, reduz de metade a pena imposta."],
  ["313","Peculato mediante erro de outrem","Apropriar-se de dinheiro ou qualquer utilidade que, no exercício do cargo, recebeu por erro de outrem: Pena - reclusão, de um a quatro anos, e multa."],
  ["313-A","Inserção de dados falsos em sistema de informações","Inserir ou facilitar, o funcionário autorizado, a inserção de dados falsos, alterar ou excluir indevidamente dados corretos nos sistemas informatizados ou bancos de dados da Administração Pública com o fim de obter vantagem indevida para si ou para outrem ou para causar dano: Pena - reclusão, de dois a doze anos, e multa."],
  ["314","Extravio, sonegação ou inutilização de livro ou documento","Extraviar livro oficial ou qualquer documento, de que tem a guarda em razão do cargo; sonegá-lo ou inutilizá-lo, total ou parcialmente: Pena - reclusão, de um a quatro anos, se o fato não constitui crime mais grave."],
  ["315","Emprego irregular de verbas ou rendas públicas","Dar às verbas ou rendas públicas aplicação diversa da estabelecida em lei: Pena - detenção, de um a três meses, ou multa."],
  ["316","Concussão","Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida: Pena - reclusão, de dois a doze anos, e multa. § 1º Se o funcionário exige tributo ou contribuição social que sabe ou deveria saber indevido, ou, quando devido, emprega na cobrança meio vexatório ou gravoso, que a lei não autoriza: Pena - reclusão, de três a oito anos, e multa."],
  ["317","Corrupção passiva","Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem: Pena - reclusão, de dois a doze anos, e multa. § 1º A pena é aumentada de um terço, se, em consequência da vantagem ou promessa, o funcionário retarda ou deixa de praticar qualquer ato de ofício ou o pratica infringindo dever funcional. § 2º Se o funcionário pratica, deixa de praticar ou retarda ato de ofício, com infração de dever funcional, cedendo a pedido ou influência de outrem: Pena - detenção, de três meses a um ano, ou multa."],
  ["319","Prevaricação","Retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal: Pena - detenção, de três meses a um ano, e multa."],
  ["320","Condescendência criminosa","Deixar o funcionário, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não levar o fato ao conhecimento da autoridade competente: Pena - detenção, de quinze dias a um mês, ou multa."],
  ["321","Advocacia administrativa","Patrocinar, direta ou indiretamente, interesse privado perante a administração pública, valendo-se da qualidade de funcionário: Pena - detenção, de um a três meses, ou multa. Parágrafo único. Se o interesse é ilegítimo: Pena - detenção, de três meses a um ano, além da multa."],
  ["322","Violência arbitrária","Praticar violência, no exercício de função ou a pretexto de exercê-la: Pena - detenção, de seis meses a três anos, além da pena correspondente à violência."],
  ["323","Abandono de função","Abandonar cargo público, fora dos casos permitidos em lei: Pena - detenção, de quinze dias a um mês, ou multa. § 1º Se do fato resulta prejuízo público: Pena - detenção, de três meses a um ano, e multa. § 2º Se o fato ocorre em lugar compreendido na faixa de fronteira: Pena - detenção, de um a três anos, e multa."],
  ["325","Violação de sigilo funcional","Revelar fato de que tem ciência em razão do cargo e que deva permanecer em segredo, ou facilitar-lhe a revelação: Pena - detenção, de seis meses a dois anos, ou multa, se o fato não constitui crime mais grave."],
  ["327","Funcionário público","Considera-se funcionário público, para os efeitos penais, quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública. § 1º Equipara-se a funcionário público quem exerce cargo, emprego ou função em entidade paraestatal, e quem trabalha para empresa prestadora de serviço contratada ou conveniada para a execução de atividade típica da Administração Pública. § 2º A pena será aumentada da terça parte quando os autores dos crimes previstos neste Capítulo forem ocupantes de cargos em comissão ou de função de direção ou assessoramento de órgão da administração direta, sociedade de economia mista, empresa pública ou fundação instituída pelo poder público."],
  ["328","Usurpação de função pública","Usurpar o exercício de função pública: Pena - detenção, de três meses a dois anos, e multa. Parágrafo único. Se do fato o agente aufere vantagem: Pena - reclusão, de dois a cinco anos, e multa."],
  ["329","Resistência","Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio: Pena - detenção, de dois meses a dois anos. § 1º Se o ato, em razão da resistência, não se executa: Pena - reclusão, de um a três anos."],
  ["330","Desobediência","Desobedecer a ordem legal de funcionário público: Pena - detenção, de quinze dias a seis meses, e multa."],
  ["331","Desacato","Desacatar funcionário público no exercício da função ou em razão dela: Pena - detenção, de seis meses a dois anos, ou multa."],
  ["332","Tráfico de influência","Solicitar, exigir, cobrar ou obter, para si ou para outrem, vantagem ou promessa de vantagem, a pretexto de influir em ato praticado por funcionário público no exercício da função: Pena - reclusão, de dois a cinco anos, e multa. Parágrafo único. A pena é aumentada da metade, se o agente alega ou insinua que a vantagem é também destinada ao funcionário."],
  ["333","Corrupção ativa","Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício: Pena - reclusão, de dois a doze anos, e multa. Parágrafo único. A pena é aumentada de um terço, se, em razão da vantagem ou promessa, o funcionário retarda ou omite ato de ofício, ou o pratica infringindo dever funcional."],
  ["337","Subtração ou inutilização de livro ou documento","Subtrair, ou inutilizar, total ou parcialmente, livro oficial, processo ou documento confiado à custódia de funcionário, em razão de ofício, ou de particular em serviço público: Pena - reclusão, de dois a cinco anos, se o fato não constitui crime mais grave."],
  ["340","Comunicação falsa de crime ou de contravenção","Provocar a ação de autoridade, comunicando-lhe a ocorrência de crime ou de contravenção que sabe não se ter verificado: Pena - detenção, de um a seis meses, ou multa."],
  ["341","Autoacusação falsa","Acusar-se, perante a autoridade, de crime inexistente ou praticado por outrem: Pena - detenção, de três meses a dois anos, ou multa."],
  ["342","Falso testemunho ou falsa perícia","Fazer afirmação falsa, ou negar ou calar a verdade como testemunha, perito, contador, tradutor ou intérprete em processo judicial, ou administrativo, inquérito policial, ou em juízo arbitral: Pena - reclusão, de dois a quatro anos, e multa. § 2º O fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o agente se retrata ou declara a verdade."],
  ["344","Coação no curso do processo","Usar de violência ou grave ameaça, com o fim de favorecer interesse próprio ou alheio, contra autoridade, parte, ou qualquer outra pessoa que funciona ou é chamada a intervir em processo judicial, policial ou administrativo, ou em juízo arbitral: Pena - reclusão, de um a quatro anos, e multa, além da pena correspondente à violência."],
  ["345","Exercício arbitrário das próprias razões","Fazer justiça pelas próprias mãos, para satisfazer pretensão, embora legítima, salvo quando a lei o permite: Pena - detenção, de quinze dias a um mês, ou multa, além da pena correspondente à violência. Parágrafo único. Se não há emprego de violência, somente se procede mediante queixa."],
  ["347","Fraude processual","Inovar artificiosamente, na pendência de processo civil ou administrativo, o estado de lugar, de coisa ou de pessoa, com o fim de induzir a erro o juiz ou o perito: Pena - detenção, de três meses a dois anos, e multa. Parágrafo único. Se a inovação se destina a produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em dobro."],
  ["357","Exploração de prestígio","Solicitar ou receber dinheiro ou qualquer outra utilidade, a pretexto de influir em juiz, jurado, órgão do Ministério Público, funcionário de justiça, perito, tradutor, intérprete ou testemunha: Pena - reclusão, de um a cinco anos, e multa. Parágrafo único. As penas aumentam-se de um terço, se o agente alega ou insinua que o dinheiro ou utilidade também se destina a qualquer das pessoas referidas neste artigo."],
  ["359","Desobediência a decisão judicial sobre perda ou suspensão de direito","Exercer função, atividade, direito, autoridade ou múnus, de que foi suspenso ou privado por decisão judicial: Pena - detenção, de três meses a dois anos, ou multa."]
 ]},
 {id:"cpp", nome:"Código de Processo Penal", sigla:"CPP", materia:"ppenal", arts:[
  ["261","Defensor","Nenhum acusado, ainda que ausente ou foragido, será processado ou julgado sem defensor."],
  ["263","Defensor dativo","Se o acusado não o tiver, ser-lhe-á nomeado defensor pelo juiz, ressalvado o seu direito de, a todo tempo, nomear outro de sua confiança, ou a si mesmo defender-se, caso tenha habilitação. Parágrafo único. O acusado, que não for pobre, será obrigado a pagar os honorários do defensor dativo, arbitrados pelo juiz."],
  ["265","Abandono do processo","O defensor não poderá abandonar o processo senão por motivo imperioso, comunicado previamente o juiz, sob pena de multa de 10 (dez) a 100 (cem) salários mínimos, sem prejuízo das demais sanções cabíveis."],
  ["351","Citação por mandado","A citação inicial far-se-á por mandado, quando o réu estiver no território sujeito à jurisdição do juiz que a houver ordenado."],
  ["360","Réu preso","Se o réu estiver preso, será pessoalmente citado."],
  ["361","Citação por edital","Se o réu não for encontrado, será citado por edital, com o prazo de 15 (quinze) dias."],
  ["362","Citação com hora certa","Verificando que o réu se oculta para não ser citado, o oficial de justiça certificará a ocorrência e procederá à citação com hora certa, na forma estabelecida nos arts. 227 a 229 da Lei nº 5.869, de 11 de janeiro de 1973 - Código de Processo Civil. Parágrafo único. Completada a citação com hora certa, se o acusado não comparecer, ser-lhe-á nomeado defensor dativo."],
  ["366","Suspensão do processo","Se o acusado, citado por edital, não comparecer, nem constituir advogado, ficarão suspensos o processo e o curso do prazo prescricional, podendo o juiz determinar a produção antecipada das provas consideradas urgentes e, se for o caso, decretar prisão preventiva, nos termos do disposto no art. 312."],
  ["367","Revelia","O processo seguirá sem a presença do acusado que, citado ou intimado pessoalmente para qualquer ato, deixar de comparecer sem motivo justificado, ou, no caso de mudança de residência, não comunicar o novo endereço ao juízo."],
  ["396","Resposta à acusação","Nos procedimentos ordinário e sumário, oferecida a denúncia ou queixa, o juiz, se não a rejeitar liminarmente, recebê-la-á e ordenará a citação do acusado para responder à acusação, por escrito, no prazo de 10 (dez) dias."],
  ["400","Audiência de instrução","Na audiência de instrução e julgamento, a ser realizada no prazo máximo de 60 (sessenta) dias, proceder-se-á à tomada de declarações do ofendido, à inquirição das testemunhas arroladas pela acusação e pela defesa, nesta ordem, ressalvado o disposto no art. 222 deste Código, bem como aos esclarecimentos dos peritos, às acareações e ao reconhecimento de pessoas e coisas, interrogando-se, em seguida, o acusado."],
  ["401","Testemunhas","Na instrução poderão ser inquiridas até 8 (oito) testemunhas arroladas pela acusação e 8 (oito) pela defesa."],
  ["403","Alegações finais","Não havendo requerimento de diligências, ou sendo indeferido, serão oferecidas alegações finais orais por 20 (vinte) minutos, respectivamente, pela acusação e pela defesa, prorrogáveis por mais 10 (dez), proferindo o juiz, a seguir, sentença."],
  ["447","Tribunal do Júri","O Tribunal do Júri é composto por 1 (um) juiz togado, seu presidente e por 25 (vinte e cinco) jurados que serão sorteados dentre os alistados, 7 (sete) dos quais constituirão o Conselho de Sentença em cada sessão de julgamento."],
  ["531","Procedimento sumário","Na audiência de instrução e julgamento, a ser realizada no prazo máximo de 30 (trinta) dias, proceder-se-á à tomada de declarações do ofendido, se possível, à inquirição das testemunhas arroladas pela acusação e pela defesa, nesta ordem, ressalvado o disposto no art. 222 deste Código, bem como aos esclarecimentos dos peritos, às acareações e ao reconhecimento de pessoas e coisas, interrogando-se, em seguida, o acusado e procedendo-se, finalmente, ao debate."],
  ["532","Testemunhas no sumário","Na instrução, poderão ser inquiridas até 5 (cinco) testemunhas arroladas pela acusação e 5 (cinco) pela defesa."],
  ["576","Desistência do MP","O Ministério Público não poderá desistir de recurso que haja interposto."],
  ["579","Fungibilidade","Salvo a hipótese de má-fé, a parte não será prejudicada pela interposição de um recurso por outro."],
  ["586","Prazo do RESE","O recurso voluntário poderá ser interposto no prazo de cinco dias."],
  ["617","Vedação da reformatio in pejus","O tribunal, câmara ou turma atenderá nas suas decisões ao disposto nos arts. 383, 386 e 387, no que for aplicável, não podendo, porém, ser agravada a pena, quando somente o réu houver apelado da sentença."],
  ["619","Embargos de declaração","Aos acórdãos proferidos pelos Tribunais de Apelação, câmaras ou turmas, poderão ser opostos embargos de declaração, no prazo de dois dias contado da sua publicação, quando houver na sentença ambiguidade, obscuridade, contradição ou omissão."],
  ["622","Revisão criminal","A revisão poderá ser requerida em qualquer tempo, antes da extinção da pena ou após. Parágrafo único. Não será admissível a reiteração do pedido, salvo se fundado em novas provas."],
  ["647","Habeas corpus","Dar-se-á habeas corpus sempre que alguém sofrer ou se achar na iminência de sofrer violência ou coação ilegal na sua liberdade de ir e vir, salvo nos casos de punição disciplinar."]
 ]},
 {id:"l9099", nome:"Lei nº 9.099/1995 (Juizados Especiais)", sigla:"Lei 9.099", materia:"pcivil", arts:[
  ["3º","Competência do JEC","O Juizado Especial Cível tem competência para conciliação, processo e julgamento das causas cíveis de menor complexidade, assim consideradas: I - as causas cujo valor não exceda a quarenta vezes o salário mínimo; (...) III - a ação de despejo para uso próprio; IV - as ações possessórias sobre bens imóveis de valor não excedente ao fixado no inciso I deste artigo."],
  ["8º","Partes","Não poderão ser partes, no processo instituído por esta Lei, o incapaz, o preso, as pessoas jurídicas de direito público, as empresas públicas da União, a massa falida e o insolvente civil."],
  ["9º","Assistência por advogado","Nas causas de valor até vinte salários mínimos, as partes comparecerão pessoalmente, podendo ser assistidas por advogado; nas de valor superior, a assistência é obrigatória."],
  ["10","Intervenção de terceiros","Não se admitirá, no processo, qualquer forma de intervenção de terceiro nem de assistência. Admitir-se-á o litisconsórcio."],
  ["16","Sessão de conciliação","Registrado o pedido, independentemente de distribuição e autuação, a Secretaria do Juizado designará a sessão de conciliação, a realizar-se no prazo de quinze dias."],
  ["18","Citação no JEC","A citação far-se-á: I - por correspondência, com aviso de recebimento em mão própria; (...) § 2º Não se fará citação por edital."],
  ["61","Menor potencial ofensivo","Consideram-se infrações penais de menor potencial ofensivo, para os efeitos desta Lei, as contravenções penais e os crimes a que a lei comine pena máxima não superior a 2 (dois) anos, cumulada ou não com multa."],
  ["74","Composição dos danos civis","A composição dos danos civis será reduzida a escrito e, homologada pelo Juiz mediante sentença irrecorrível, terá eficácia de título a ser executado no juízo civil competente. Parágrafo único. Tratando-se de ação penal de iniciativa privada ou de ação penal pública condicionada à representação, o acordo homologado acarreta a renúncia ao direito de queixa ou representação."],
  ["88","Representação","Além das hipóteses do Código Penal e da legislação especial, dependerá de representação a ação penal relativa aos crimes de lesões corporais leves e lesões culposas."],
  ["89","Suspensão condicional do processo","Nos crimes em que a pena mínima cominada for igual ou inferior a um ano, abrangidas ou não por esta Lei, o Ministério Público, ao oferecer a denúncia, poderá propor a suspensão do processo, por dois a quatro anos, desde que o acusado não esteja sendo processado ou não tenha sido condenado por outro crime, presentes os demais requisitos que autorizariam a suspensão condicional da pena."]
 ]},
 {id:"cpc", nome:"Código de Processo Civil", sigla:"CPC", materia:"pcivil", arts:[
  ["146","Arguição de impedimento/suspeição","No prazo de 15 (quinze) dias, a contar do conhecimento do fato, a parte alegará o impedimento ou a suspeição, em petição específica dirigida ao juiz do processo, na qual indicará o fundamento da recusa, podendo instruí-la com documentos em que se fundar a alegação e com rol de testemunhas."],
  ["188","Forma dos atos","Os atos e os termos processuais independem de forma determinada, salvo quando a lei expressamente a exigir, considerando-se válidos os que, realizados de outro modo, lhe preencham a finalidade essencial."],
  ["212","Tempo dos atos","Os atos processuais serão realizados em dias úteis, das 6 (seis) às 20 (vinte) horas."],
  ["213","Prática eletrônica","A prática eletrônica de ato processual pode ocorrer em qualquer horário até as 24 (vinte e quatro) horas do último dia do prazo."],
  ["218","Prazos","Os atos processuais serão realizados nos prazos prescritos em lei. (...) § 3º Inexistindo preceito legal ou prazo determinado pelo juiz, será de 5 (cinco) dias o prazo para a prática de ato processual a cargo da parte."],
  ["219","Dias úteis","Na contagem de prazo em dias, estabelecido por lei ou pelo juiz, computar-se-ão somente os dias úteis. Parágrafo único. O disposto neste artigo aplica-se somente aos prazos processuais."],
  ["220","Suspensão de fim de ano","Suspende-se o curso do prazo processual nos dias compreendidos entre 20 de dezembro e 20 de janeiro, inclusive."],
  ["222","Prorrogação","Na comarca, seção ou subseção judiciária onde for difícil o transporte, o juiz poderá prorrogar os prazos por até 2 (dois) meses."],
  ["226","Prazos do juiz","O juiz proferirá: I - os despachos no prazo de 5 (cinco) dias; II - as decisões interlocutórias no prazo de 10 (dez) dias; III - as sentenças no prazo de 30 (trinta) dias."],
  ["228","Prazos do serventuário","Incumbirá ao serventuário remeter os autos conclusos no prazo de 1 (um) dia e executar os atos processuais no prazo de 5 (cinco) dias, contado da data em que: I - houver concluído o ato processual anterior, se lhe foi imposto pela lei; II - tiver ciência da ordem, quando determinada pelo juiz."],
  ["229","Litisconsortes","Os litisconsortes que tiverem diferentes procuradores, de escritórios de advocacia distintos, terão prazos contados em dobro para todas as suas manifestações, em qualquer juízo ou tribunal, independentemente de requerimento."],
  ["238","Citação","Citação é o ato pelo qual são convocados o réu, o executado ou o interessado para integrar a relação processual."],
  ["240","Efeitos da citação","A citação válida, ainda quando ordenada por juízo incompetente, induz litispendência, torna litigiosa a coisa e constitui em mora o devedor, ressalvado o disposto nos arts. 397 e 398 da Lei nº 10.406, de 10 de janeiro de 2002 (Código Civil)."],
  ["252","Citação com hora certa","Quando, por 2 (duas) vezes, o oficial de justiça houver procurado o citando em seu domicílio ou residência sem o encontrar, deverá, havendo suspeita de ocultação, intimar qualquer pessoa da família ou, em sua falta, qualquer vizinho de que, no dia útil imediato, voltará a fim de efetuar a citação, na hora que designar."],
  ["254","Carta após hora certa","Feita a citação com hora certa, o escrivão ou chefe de secretaria enviará ao réu, executado ou interessado, no prazo de 10 (dez) dias, contado da data da juntada do mandado aos autos, carta, telegrama ou correspondência eletrônica, dando-lhe de tudo ciência."],
  ["258","Multa por edital doloso","A parte que requerer a citação por edital, alegando dolosamente a ocorrência das circunstâncias autorizadoras para sua realização, incorrerá em multa de 5 (cinco) vezes o salário-mínimo."],
  ["269","Intimação","Intimação é o ato pelo qual se dá ciência a alguém dos atos e dos termos do processo."],
  ["300","Tutela de urgência","A tutela de urgência será concedida quando houver elementos que evidenciem a probabilidade do direito e o perigo de dano ou o risco ao resultado útil do processo. (...) § 3º A tutela de urgência de natureza antecipada não será concedida quando houver perigo de irreversibilidade dos efeitos da decisão."],
  ["308","Pedido principal","Efetivada a tutela cautelar, o pedido principal terá de ser formulado pelo autor no prazo de 30 (trinta) dias, caso em que será apresentado nos mesmos autos em que deduzido o pedido de tutela cautelar, não dependendo do adiantamento de novas custas processuais."],
  ["321","Emenda da inicial","O juiz, ao verificar que a petição inicial não preenche os requisitos dos arts. 319 e 320 ou que apresenta defeitos e irregularidades capazes de dificultar o julgamento de mérito, determinará que o autor, no prazo de 15 (quinze) dias, a emende ou a complete, indicando com precisão o que deve ser corrigido ou completado."],
  ["334","Audiência de conciliação","Se a petição inicial preencher os requisitos essenciais e não for o caso de improcedência liminar do pedido, o juiz designará audiência de conciliação ou de mediação com antecedência mínima de 30 (trinta) dias, devendo ser citado o réu com pelo menos 20 (vinte) dias de antecedência."],
  ["335","Contestação","O réu poderá oferecer contestação, por petição, no prazo de 15 (quinze) dias, cujo termo inicial será a data: I - da audiência de conciliação ou de mediação, ou da última sessão de conciliação, quando qualquer parte não comparecer ou, comparecendo, não houver autocomposição; (...)"],
  ["344","Revelia","Se o réu não contestar a ação, será considerado revel e presumir-se-ão verdadeiras as alegações de fato formuladas pelo autor."],
  ["1.003","Prazo recursal","§ 5º Excetuados os embargos de declaração, o prazo para interpor os recursos e para responder-lhes é de 15 (quinze) dias."],
  ["1.023","Embargos de declaração","Os embargos serão opostos, no prazo de 5 (cinco) dias, em petição dirigida ao juiz, com indicação do erro, obscuridade, contradição ou omissão, e não se sujeitam a preparo."],
  ["1.026","Efeitos dos embargos","Os embargos de declaração não possuem efeito suspensivo e interrompem o prazo para a interposição de recurso. (...) § 2º Quando manifestamente protelatórios os embargos de declaração, o juiz ou o tribunal, em decisão fundamentada, condenará o embargante a pagar ao embargado multa não excedente a dois por cento sobre o valor atualizado da causa."]
 ]},
 {id:"cf", nome:"Constituição Federal", sigla:"CF", materia:"const", arts:[

  ["37, caput","Princípios","A administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios de legalidade, impessoalidade, moralidade, publicidade e eficiência (...)"],

// ---------- utilidades ----------
const rnd = (a,b)=> Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function hash(str){ let h=0; for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i); h|=0;} return Math.abs(h).toString(36); }
const fmtBR = (n,d=2)=> n.toLocaleString("pt-BR",{minimumFractionDigits:d, maximumFractionDigits:d});
const money = n => "R$ "+fmtBR(n);
// monta questão com alternativas numéricas embaralhadas
function mkQ(s,t,q,correct,wrongs,e){
  const set = [correct]; for(const w of wrongs){ if(set.length>=5) break; if(!set.includes(w)) set.push(w); }
  let k=1; while(set.length<5){ const v = correct+" ("+(k++)+")"; set.push(v); }
  const o = shuffle(set); const a = o.indexOf(correct);
  return {id:"g-"+hash(q+o.join("|")), s, t, q, o, a, e, src:"gerada"};
}

  if(opts.extra) opts.extra.forEach(x=>{ if(x!==v && x>0) c.add(fmt(x)); });
  return shuffle([...c]).filter(x=>x!==fmt(v));
}

// ---------- LEI SECA (literalidade) ----------
const NUMW = {1:"um",2:"dois",3:"três",4:"quatro",5:"cinco",6:"seis",7:"sete",8:"oito",10:"dez",12:"doze",15:"quinze",20:"vinte",24:"vinte e quatro",25:"vinte e cinco",30:"trinta",40:"quarenta",45:"quarenta e cinco",60:"sessenta",90:"noventa",100:"cem"};
const WORDNUMS = ["um","dois","três","quatro","cinco","seis","sete","oito","dez","doze","quinze","vinte","trinta","quarenta","sessenta","cem"];
const FRAC = ["um terço","metade","terça parte","sexta parte","dois terços","dobro"];
const SWAP = [["reclusão","detenção"],["detenção","reclusão"],["e multa","ou multa"],["ou multa","e multa"],["inafiançável e imprescritível","afiançável e imprescritível"],["durante o dia","a qualquer hora"],["dias úteis","dias corridos"],["interrompem","suspendem"],["não possuem efeito suspensivo","possuem efeito suspensivo"],["não poderá desistir","poderá desistir"]];
function findTokens(txt){
  const toks=[];
  let m; const re1=/(\d+) \(([a-zà-ú\- ]+?)\)/g;
  while((m=re1.exec(txt))){ toks.push({i:m.index, s:m[0], kind:"numpar", n:+m[1]}); }
  const re2=new RegExp("\\b("+WORDNUMS.join("|")+")\\b(?=\\s+(?:a\\s+[a-zà-ú]+\\s+)?(?:anos?|meses|mês|dias?|horas|vezes|salários?|quintos|por cento|turnos))","g");
  while((m=re2.exec(txt))){ if(!toks.some(t=>m.index>=t.i && m.index<t.i+t.s.length)) toks.push({i:m.index, s:m[0], kind:"word"}); }
  const re3=new RegExp("\\b("+FRAC.join("|")+")\\b","g");
  while((m=re3.exec(txt))){ toks.push({i:m.index, s:m[0], kind:"frac"}); }
  for(const [a] of SWAP){ const k=txt.indexOf(a); if(k>=0) toks.push({i:k, s:a, kind:"swap"}); }
  return toks.sort((a,b)=>a.i-b.i);
}
function altToken(t){
  if(t.kind==="numpar"){ const keys=Object.keys(NUMW).map(Number).filter(n=>n!==t.n); const out=shuffle(keys).slice(0,6).map(n=>`${n} (${NUMW[n]})`); return out; }
  if(t.kind==="word"){ const small=["um","dois","três","quatro","cinco","seis","oito","dez","doze","quinze","vinte"]; const pool = small.includes(t.s) ? small : WORDNUMS; return shuffle(pool.filter(w=>w!==t.s)).slice(0,6); }
  if(t.kind==="frac") return shuffle(FRAC.filter(w=>w!==t.s)).slice(0,5);
  if(t.kind==="swap") return SWAP.filter(p=>p[0]===t.s).map(p=>p[1]);
  return [];
}
function snippet(txt, tok){
  // trecho: do início da frase/parágrafo que contém o token até o fim dela
  let start = 0; const cut = /(§ \d+º|Parágrafo único\.|Pena -|[IVX]+ - )/g; let m;
  while((m=cut.exec(txt))){ if(m.index<=tok.i) start=m.index; else break; }
  // se o trecho começa em "Pena -", incluir caput para contexto
  if(txt.slice(start,start+6)==="Pena -"){ const prev = txt.lastIndexOf("§", start); start = prev>=0 && prev<start ? prev : 0; }
  let end = txt.indexOf(". ", tok.i+tok.s.length); if(end<0) end = txt.length; else end+=1;
  let sn = txt.slice(start,end).trim();
  if(sn.length>420){ const s2 = Math.max(0, tok.i-200); sn = (s2>0?"(...) ":"")+txt.slice(s2, Math.min(txt.length, tok.i+220)).trim()+" (...)"; return {sn, off: (s2>0?6:0) + tok.i - s2}; }
  return {sn, off: tok.i-start - (txt.slice(start,end).length - txt.slice(start,end).trimStart().length)};
}
const doLaw = l => (/^(Lei|Constituição)/.test(l.nome)?"da ":"do ")+l.nome;
function lawsFor(subj){ return LEIS.filter(l=>l.materia===subj); }
function genLei(subj, lawId, depth=0){
  if(depth>8) return null;
  const laws = lawId ? LEIS.filter(l=>l.id===lawId) : lawsFor(subj);
  if(!laws.length) return null;
  const law = pick(laws);
  const cand = law.arts.map(a=>({a, toks:findTokens(a[2])})).filter(x=>x.toks.length);
  if(!cand.length) return null;
  const tipo = Math.random()<0.55 ? "lacuna" : "correta";
  if(tipo==="lacuna" || cand.length<5){
    const c = pick(cand); const tok = pick(c.toks); const alts = altToken(tok); if(alts.length<1) return genLei(subj, lawId, depth+1);
    const {sn, off} = snippet(c.a[2], tok);
    const pos = sn.indexOf(tok.s, Math.max(0,off-3)); if(pos<0) return genLei(subj, lawId, depth+1);
    const lac = sn.slice(0,pos)+"_____"+sn.slice(pos+tok.s.length);
    const opts = [tok.s, ...alts.slice(0,4)];
    while(opts.length<5){ const f = pick(["três","sete","quinze","vinte","sessenta","cem"]); if(!opts.includes(f)) opts.push(f); }
    const q = mkQ(law.materia, `Lei seca — ${law.sigla}, art. ${c.a[0]}`, `Nos termos ${doLaw(law)}, art. ${c.a[0]} (${c.a[1]}), assinale a alternativa que preenche corretamente a lacuna:\n\n“${lac}”`, tok.s, opts.slice(1), `Texto legal: “${sn}”`);
    q.lei = {law:law.id, art:c.a[0]}; return q;
  }
  // "Assinale a correta": 1 trecho verdadeiro + 4 adulterados
  const picks = shuffle(cand).slice(0,5);
  const opts = picks.map((c,i)=>{ const tok=pick(c.toks); const {sn,off}=snippet(c.a[2],tok); const pos=sn.indexOf(tok.s, Math.max(0,off-3));
    if(i===0 || pos<0) return {t:`Art. ${c.a[0]}: ${sn}`, ok:i===0 && pos>=0, src:sn};
    const alt = pick(altToken(tok)) || tok.s; return {t:`Art. ${c.a[0]}: ${sn.slice(0,pos)+alt+sn.slice(pos+tok.s.length)}`, ok:false, src:sn, wrong:`“${alt}” no lugar de “${tok.s}”`}; });
  if(!opts[0].ok || opts.slice(1).some(o=>o.t.endsWith(o.src))) return genLei(subj, lawId, depth+1);
  const correct = opts[0].t;
  const exp = "Correta: "+correct+"\n\nErros nas demais: "+opts.slice(1).map(o=>o.t.split(":")[0]+" — "+o.wrong).join("; ")+".";
  const q = mkQ(law.materia, `Lei seca — ${law.sigla}`, `De acordo com a literalidade ${doLaw(law)}, assinale a alternativa correta.`, correct, opts.slice(1).map(o=>o.t), exp);
  q.lei = {law:law.id}; return q;
}

function genFor(subj){
  if(subj==="mat") return genMat();
  if(subj==="rl") return genRL();
  if(subj==="info") return genInfo();
  if(["penal","ppenal","pcivil","const","adm","atual"].includes(subj)) return genLei(subj);
  return null;
}
